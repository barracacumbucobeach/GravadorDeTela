<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3AA8FF"/>
      <stop offset="1" stop-color="#0C57B5"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FC"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#08346E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Windows 11 "squircle" app tile background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- monitor / screen -->
  <g filter="url(#shadow)">
    <rect x="46" y="66" width="164" height="112" rx="14" fill="url(#screenGrad)"/>
    <rect x="46" y="66" width="164" height="112" rx="14" fill="none" stroke="#BFDBF7" stroke-width="2"/>
    <rect x="112" y="178" width="32" height="14" rx="3" fill="#EAF3FC"/>
    <rect x="92" y="192" width="72" height="10" rx="5" fill="#FFFFFF"/>
  </g>

  <!-- record dot -->
  <circle cx="128" cy="122" r="30" fill="#FFFFFF"/>
  <circle cx="128" cy="122" r="21" fill="#E81123"/>

  <!-- cursor pointer, ties into "follow the cursor" feature -->
  <path d="M168 150 L204 186 L192 189 L200 206 L191 210 L183 193 L172 202 Z"
        fill="#FFFFFF" stroke="#0C57B5" stroke-width="3" stroke-linejoin="round"/>
</svg>
